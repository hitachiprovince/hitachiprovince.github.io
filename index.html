<!DOCTYPE html>
<html>
<head>
  <title>Roleplay Map — Live JSON Map</title>
  <meta charset="utf-8" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
    #map {
      background: #ddd;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 50px;
      background: rgba(255,255,255,0.9);
      padding: 8px;
      border-radius: 8px;
      font-family: sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      z-index: 1000;
    }
    button {
      margin: 2px;
      cursor: pointer;
    }
    #adminNotice {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      z-index: 1000;
    }
  </style>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <button id="addPinBtn">➕ Add Pin</button>
    <button id="removePinBtn">🗑 Remove Pin</button>
    <button id="colorBtn">🎨 Color Mode</button>
    <input type="color" id="colorPicker" value="#ffcc00" style="display:none;">
    <button id="exportBtn">⬇️ Export to File</button>
    <span style="margin-left:8px; opacity:0.7;">Admin mode active (Changes will not be saved permanently)</span>
  </div>
  <div id="adminNotice">Admin mode enabled</div>

  <script>
    const MAP_SOURCE_FILE = 'roleplay_map_export.json';
    const FALLBACK_SVG_FILE = 'drawing2.svg';

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 2,
      zoomSnap: 0.1,   // allow fractional zoom so the whole SVG can fit the window
      zoomDelta: 0.5,
    });

    let bounds = [[0, 0], [1, 1]]; // real bounds are computed from the SVG
    let svgOverlay = null;
    let svgElement = null;
    let currentColors = {};
    let mode = "none";
    let markers = [];
    let isAdmin = false;

    // --- Read SVG size and make sure it has a viewBox so it can scale ---
    function prepareSvg(svg) {
      let w, h;
      const vb = svg.getAttribute('viewBox');

      if (vb) {
        const parts = vb.trim().split(/[\s,]+/).map(Number);
        w = parts[2];
        h = parts[3];
      } else {
        w = parseFloat(svg.getAttribute('width'));
        h = parseFloat(svg.getAttribute('height'));
        if (!w || !h) {
          // Last resort: guess a size so something is visible
          w = 1000;
          h = 1000;
        }
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }

      // Let Leaflet control the rendered size
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

      return { w, h };
    }

    // --- Core Loading Logic ---
    function loadMap(pinsData, colorsData, svgText) {
      // 1. Load SVG
      const parser = new DOMParser();
      const svgDoc = parser.parseFromString(svgText, "image/svg+xml");
      svgElement = svgDoc.documentElement;

      const { w, h } = prepareSvg(svgElement);
      bounds = [[0, 0], [h, w]];

      if (svgOverlay) {
        map.removeLayer(svgOverlay);
      }
      svgOverlay = L.svgOverlay(svgElement, bounds, { interactive: true }).addTo(map);

      map.fitBounds(bounds);
      map.setMinZoom(map.getBoundsZoom(bounds) - 1);
      map.setMaxBounds(L.latLngBounds(bounds).pad(0.25));

      // 2. Load Coloring
      currentColors = colorsData || {};
      enableColoring(svgElement);

      // 3. Load Pins
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      (pinsData || []).forEach(p => {
        const m = L.marker(p.latlng).addTo(map);
        m.bindPopup(p.text);
        markers.push(m);
      });
    }

    // Keep the whole map in view when the window is resized
    window.addEventListener('resize', () => {
      if (svgOverlay) {
        map.setMinZoom(map.getBoundsZoom(bounds) - 1);
      }
    });

    // --- Automatic File Fetch and Map Initialization ---
    fetch(MAP_SOURCE_FILE)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        loadMap(data.pins, data.colors, data.svg);
      })
      .catch(err => {
        console.warn(`Could not load "${MAP_SOURCE_FILE}" (${err.message}). Falling back to "${FALLBACK_SVG_FILE}".`);
        return fetch(FALLBACK_SVG_FILE)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then(svgText => loadMap([], {}, svgText))
          .catch(error => {
            console.error("Critical error during map initialization:", error);
            alert("The map could not be loaded.");
          });
      });


    // --- Admin UI & Handlers ---
    const controls = document.getElementById("controls");
    const adminNotice = document.getElementById("adminNotice");
    const colorBtn = document.getElementById("colorBtn");
    const colorPicker = document.getElementById("colorPicker");
    const exportBtn = document.getElementById("exportBtn");

    document.getElementById("addPinBtn").onclick = () => {
      mode = "add";
      map.getContainer().style.cursor = "crosshair";
    };
    document.getElementById("removePinBtn").onclick = () => {
      mode = "remove";
      map.getContainer().style.cursor = "not-allowed";
    };
    colorBtn.onclick = () => {
      if (!isAdmin) return;
      mode = "color";
      colorPicker.style.display = "inline-block";
      map.getContainer().style.cursor = "pointer";
    };
    exportBtn.onclick = exportMapData;


    // --- Map click behavior ---
    map.on("click", e => {
      if (!isAdmin) return;
      if (mode === "add") {
        const text = prompt("Enter description for this pin:");
        if (text !== null) {
          const m = L.marker(e.latlng).addTo(map);
          m.bindPopup(text);
          markers.push(m);
        }
      }
      if (mode !== "color") {
        mode = "none";
        map.getContainer().style.cursor = "";
        colorPicker.style.display = "none";
      }
    });

    // --- Popup Edit/Delete only for Admin ---
    map.on("popupopen", e => {
      if (!isAdmin) return;
      const marker = e.popup._source;
      const popupEl = e.popup.getElement();
      if (!popupEl.querySelector(".popup-controls")) {
        const div = document.createElement("div");
        div.className = "popup-controls";
        div.innerHTML = `
          <hr>
          <button class="edit">✏ Edit</button>
          <button class="delete">🗑 Delete</button>
        `;
        popupEl.querySelector(".leaflet-popup-content").appendChild(div);

        div.querySelector(".edit").onclick = () => {
          const currentText = marker.getPopup().getContent().split("<hr>")[0].trim();
          const newText = prompt("Edit pin text:", currentText);
          if (newText !== null) {
            marker.bindPopup(newText).openPopup();
          }
        };

        div.querySelector(".delete").onclick = () => {
          map.removeLayer(marker);
          markers = markers.filter(m => m !== marker);
        };
      }
    });

    function getPinsData() {
      return markers.map(m => ({
        latlng: m.getLatLng(),
        text: m.getPopup().getContent().split("<hr>")[0].trim(),
      }));
    }

    // --- Hidden admin activation ---
    let keySequence = [];
    const secret = "admin";

    window.addEventListener("keydown", e => {
      keySequence.push(e.key.toLowerCase());
      if (keySequence.join("").includes(secret)) {
        enableAdmin();
        keySequence = [];
      }
      if (keySequence.length > 10) keySequence.shift();
    });

    function enableAdmin() {
      const password = prompt("Enter admin password:");
      if (password === "iksdehitachi") {
        isAdmin = true;
        controls.style.display = "block";
        adminNotice.style.display = "block";
        setTimeout(() => adminNotice.style.display = "none", 2500);
      } else {
        alert("Incorrect password");
      }
    }

    // --- Province coloring ---
    function enableColoring(svgRoot) {
      const colorableElements = svgRoot.querySelectorAll("path, polygon, g[id]");

      colorableElements.forEach(el => {
        if (el.id) {
          if (!el.style.fill || el.style.fill === 'none') {
            el.style.fill = 'transparent';
          }
          el.style.pointerEvents = 'all';
        }
      });

      for (const [id, color] of Object.entries(currentColors)) {
        const el = svgRoot.querySelector(`#${CSS.escape(id)}`);
        if (el) el.style.fill = color;
      }

      svgRoot.addEventListener("click", (ev) => {
        if (!isAdmin || mode !== "color") return;

        const target = ev.target;
        const isColorableTag = (target.tagName === "path" || target.tagName === "polygon" || target.tagName === "g");

        if (!isColorableTag || !target.id) return;

        const color = colorPicker.value;
        target.style.fill = color;
        currentColors[target.id] = color;
      });
    }

    // --- Export Functionality ---
    function exportMapData() {
      if (!svgElement) return alert("Map SVG not loaded yet!");

      const pinsData = getPinsData();
      const colorsData = currentColors;

      const svgClone = svgElement.cloneNode(true);

      // Strip Leaflet's runtime classes/styles so the exported SVG stays clean
      svgClone.removeAttribute('class');
      svgClone.removeAttribute('style');

      for (const [id, color] of Object.entries(colorsData)) {
        const el = svgClone.querySelector(`#${CSS.escape(id)}`);
        if (el) el.style.fill = color;
      }

      const exportObject = {
        version: "1.0",
        svg: svgClone.outerHTML,
        pins: pinsData,
        colors: colorsData
      };

      const jsonString = JSON.stringify(exportObject, null, 2);

      const blob = new Blob([jsonString], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = MAP_SOURCE_FILE;

      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
